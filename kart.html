<style>
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#0B2545; --fg:#1C2836; --muted:#617084; --line:#D5DDE6;
  --accent:#E8590C; --ok:#1E7B4C; --ok-soft:#E1F3EA; --warn:#8A5A00; --warn-soft:#FFF4CC; --err:#B42318; --err-soft:#FBE4E2;
  --field:#F7F9FB; --hero:#0B2545;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --surface:#121D2E; --ink:#E6EEF8; --fg:#D6DFEA; --muted:#8C9AAE; --line:#26354B;
  --accent:#FF7A33; --ok:#5BC48E; --ok-soft:#123224; --warn:#F3C35B; --warn-soft:#3A2E10; --err:#FF8A80; --err-soft:#3A1715;
  --field:#0E1828; --hero:#0B1A30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#121D2E; --ink:#E6EEF8; --fg:#D6DFEA; --muted:#8C9AAE; --line:#26354B;
  --accent:#FF7A33; --ok:#5BC48E; --ok-soft:#123224; --warn:#F3C35B; --warn-soft:#3A2E10; --err:#FF8A80; --err-soft:#3A1715;
  --field:#0E1828; --hero:#0B1A30; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);
  padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px}
.brand{display:inline-flex;background:#fff;border-radius:12px;padding:7px 11px;border:1px solid var(--line)}
.brand img{height:40px;width:auto;display:block}
.top small{font:600 11px var(--sans);letter-spacing:.12em;color:var(--muted);text-align:right;line-height:1.35}
.hero{background:var(--hero);color:#fff;border-radius:18px;padding:22px 20px 20px;position:relative;overflow:hidden;isolation:isolate}
.hero:before{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,89,12,.35),transparent 65%);z-index:-1}
.hero .lab{font:600 11px var(--sans);letter-spacing:.12em;color:rgba(255,255,255,.65)}
.hero h1{margin:4px 0 2px;font:700 34px/1.05 var(--sans);letter-spacing:-.01em}
.hero .sn{font:600 22px var(--mono);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.hero .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.chip.pass{background:#1E7B4C;border-color:#1E7B4C}
.chip svg{flex:none}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0}
.facts div{background:var(--surface);padding:12px 14px}
.facts span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.facts b{display:block;margin-top:3px;font:600 17px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.card h2{flex-wrap:wrap;margin:0;padding:12px 16px;font-size:12px;letter-spacing:.09em;color:var(--ink);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h2 small{font:500 11.5px var(--sans);letter-spacing:0;text-transform:none;color:var(--muted)}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font:600 11px var(--sans);letter-spacing:.06em;color:var(--muted);background:var(--field)}
td.n b{display:block;font-weight:600;color:var(--ink)}
td.n small{color:var(--muted);font-size:12.5px}
td.q,th.q{text-align:center;font-family:var(--mono);width:56px}
td.e,th.e{text-align:right;width:120px}
td.e b{font:600 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
td.e i{display:block;font:600 10.5px var(--sans);font-style:normal;letter-spacing:.04em;margin-top:2px}
tr.exp td.e b{color:var(--err)} tr.exp td.e i{color:var(--err)}
tr.soon td.e b{color:var(--warn)} tr.soon td.e i{color:var(--warn)}
tr.off td{color:var(--muted)} tr.off td.n b{color:var(--muted);font-weight:500}
.ic{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.ic h2{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:14px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--fg);font-weight:500;text-align:right}
.ok{color:var(--ok)} .bad{color:var(--err)}
.lots td{padding:8px 16px} .lots td:last-child{text-align:right;font:600 14px var(--mono)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:18px;line-height:1.55}
.foot a{color:inherit}
.state{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 20px;text-align:center}
.state h1{font:700 22px var(--sans);color:var(--ink);margin:0 0 8px}
.state p{margin:0 0 16px;color:var(--muted)}
form.q{display:flex;gap:8px;max-width:360px;margin:0 auto}
form.q input{flex:1;min-width:0;font:600 18px var(--mono);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--fg);text-align:center;letter-spacing:.06em}
form.q button,.btn{font:600 15px var(--sans);padding:12px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.sk{display:block;height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--field),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:420px){.hero h1{font-size:30px}.hero .sn{font-size:20px}td,th{padding:9px 12px}td.e,th.e{width:96px}.facts b{font-size:15px}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
@media print{body{background:#fff}.ic,.foot form{display:none}}
</style>
</head>

  <main id="main"><div class="state"><span class="sk" style="width:60%;margin:0 auto 12px"></span><span class="sk" style="width:40%;margin:0 auto"></span></div></main>
  <p class="foot">AKANA Marine Technology® · Beşikdüzü / Trabzon<br>
    <a href="https://www.akanamarinetech.com" rel="noopener">www.akanamarinetech.com</a><br>
    This card is for information and does not replace the Certificate of Inventory.<br>Bu kart bilgi amaçlıdır, Inventory Sertifikası yerine geçmez.</p>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzLROpJfsh2hrdu1x4kgBMC_PwQHXsXBxqKsVh1QU9admgBKD-bQ8F0Ss_Pj1Q_Fny2/exec";
const ITEMS={food:["Food Rations","Acil durum gıdası"],water:["Drinking Water","Acil durum suyu"],rocket:["Parachute Rocket Signal","Paraşüt roket"],
  smoke:["Buoyant Smoke Signal","Duman"],flare:["Red Hand Flare","El maytabı"],tpa:["Thermal Protective Aid","Isı koruyucu (TPA)"],aid:["First Aid Kit","İlk yardım"],
  tab:["Anti-Seasickness Tablets","Deniz tutması hapı"],torch:["Torch Battery","El feneri pili"],batt:["Lamp Battery","İç-dış lamba pili"],glue:["Repair Kit Glue","Tamir kiti yapıştırıcı"],
  rubber:["Rubber fabric","Rubber kumaşı"]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const auth=(()=>{ try{ return JSON.parse(localStorage.getItem("cert_auth")||"null"); }catch(e){ return null; } })();
const serial=(new URLSearchParams(location.search).get("s")||"").replace(/\D/g,"");
const ICON_OK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

async function api(body){ const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(body)}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
// AA/YYYY -> ay farkı (bugünden)
function monthsLeft(e){ const m=/^(\d{2})\/(\d{4})$/.exec(e||""); if(!m) return null; const n=new Date();
  return (+m[2]-n.getFullYear())*12+(+m[1]-(n.getMonth()+1)); }

function searchForm(msg){
  return `<div class="state"><h1>${msg?esc(msg):"Liferaft lookup · Sal sorgulama"}</h1>
    <p>Enter the serial number on the certificate.<br>Sertifikadaki seri numarasını yazın.</p>
    <form class="q" id="qf"><input id="qs" inputmode="numeric" maxlength="12" placeholder="20260800" aria-label="Serial No / Seri No" value="${esc(serial)}"><button>Open · Aç</button></form></div>`;
}
function bindSearch(){ const f=$("qf"); if(f) f.onsubmit=ev=>{ ev.preventDefault(); const v=$("qs").value.replace(/\D/g,""); if(v) location.search="?s="+v; }; }

function render(k,ic){
  const rows=k.items.filter(it=>String(it.q||"").trim()!=="").map(it=>{ const nm=ITEMS[it.k]||[it.k,""]; const off=!it.q||it.q==="-"||Number(it.q)===0;
    const ml=off?null:monthsLeft(it.e), cls=off?"off":ml===null?"":ml<0?"exp":ml<6?"soon":"";
    const note=off?"":ml===null?"":ml<0?"EXPIRED · SKT GEÇTİ":ml<6?"EXPIRES SOON · SKT YAKLAŞTI":"";
    return `<tr class="${cls}"><td class="n"><b>${esc(nm[0])}</b><small>${esc(nm[1])}</small></td>
      <td class="q">${off?"–":esc(it.q)}</td><td class="e">${off?"<small>Not in pack · Pakette yok</small>":`<b>${esc(it.e||"–")}</b>${note?`<i>${note}</i>`:""}`}</td></tr>`; }).join("");
  let h=`<section class="hero" aria-label="Liferaft">
      <div class="lab">INFLATABLE LIFERAFT · ŞİŞME CAN SALI</div>
      <h1>ANA-${esc(k.model)}</h1>
      <div class="sn"><span class="lab" style="font-size:11px;margin-right:6px">S/N</span>${esc(k.serial)}</div>
      <div class="row"><span class="chip pass">${ICON_OK} Test result: PASSED · Test: Başarılı</span></div>
    </section>
    <div class="facts">
      <div><span>Date of manufacture<br>Üretim tarihi</span><b>${esc(k.mfg||"–")}</b></div>
      <div><span>Capacity<br>Kapasite</span><b>${esc(k.capacity||"–")} <small style="font:500 12px var(--sans);color:var(--muted)">pers.</small></b></div>
      <div><span>Emergency pack<br>Paket</span><b>SOLAS ${esc(k.pack||"–")}</b></div>
    </div>
    <section class="card"><h2>EQUIPMENT · EKİPMAN <small>Expiry · SKT (MM/YYYY)</small></h2>
      <table><thead><tr><th>ITEM · KALEM</th><th class="q">QTY</th><th class="e">EXPIRY · SKT</th></tr></thead><tbody>${rows}</tbody></table></section>`;
  if(ic) h+=renderIc(k,ic);
  $("main").innerHTML=h; document.title=`ANA-${k.model} · ${k.serial} · Can Salı Kartı`;
}
// Sadece sisteme giriş yapmış cihazlarda görünür
function renderIc(k,ic){
  const lots=ic.lots.filter(l=>ITEMS[l.k]).map(l=>`<tr><td>${esc(ITEMS[l.k][1])}</td><td>${esc(l.lot||"–")}</td></tr>`).join("");
  const sk=ic.sk? `<span class="${/^uygun$/i.test(ic.sk.sonuc)?"ok":"bad"}">${esc(ic.sk.sonuc)}</span> · ${esc(ic.sk.tarih)}${ic.sk.onayBy?` · onay: ${esc(ic.sk.onayBy)}`:" · onay bekliyor"}` : `<span class="bad">Yapılmadı</span>`;
  const sat= ic.satis===undefined? "" : `<dt>Satış</dt><dd>${ic.satis? `${esc(ic.satis.firma)} · ${esc(ic.satis.tarih)}${ic.satis.irs?` · ${esc(ic.satis.irs)}`:""}${ic.satis.gecmis?" (geçmiş kayıt)":""}` : `<span class="ok">Stokta</span>`}</dd>`;
  return `<section class="card ic"><h2>İÇ KAYIT <small>sadece sisteme giriş yapmış cihazlarda görünür</small></h2>
    <dl class="kv"><dt>Sertifikayı yazan</dt><dd>${esc(ic.sertBy||"–")}</dd>
      <dt>Test formu</dt><dd>${ic.test? `<span class="ok">Var</span> · ${esc(ic.test.tarih)} · ${esc(ic.test.by)}` : `<span class="bad">Yok</span>`}</dd>
      <dt>İzlenebilirlik</dt><dd>${ic.izl? `<span class="ok">Kaydedildi</span> · ${esc(ic.izlBy)}` : `<span class="bad">Kaydedilmedi</span>`}</dd>
      <dt>Son kontrol</dt><dd>${sk}</dd>${sat}</dl>
    <table class="lots"><thead><tr><th>MALZEME</th><th style="text-align:right">LOT</th></tr></thead><tbody>${lots}</tbody></table>
    <div style="padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" href="./#rec" style="background:var(--ink)">Sistemde aç</a>
      <a class="btn" href="./izl.html" style="background:transparent;color:var(--ink);border:1px solid var(--line)">İzlenebilirlik</a></div></section>`;
}
if(auth&&auth.pin){ const bk=document.getElementById("back"); if(bk) bk.hidden=false; }
async function main(){
  if(!serial){ $("main").innerHTML=searchForm(); bindSearch(); return; }
  try{
    let j;
    if(auth&&auth.pin){ j=await api({action:"kartTam",pin:auth.pin,serial}); if(!j.ok&&j.code==="auth") j=null; }
    if(!j) j=await api({action:"kart",serial});
    if(j.ok){ render(j.kart,j.ic||null); return; }
    $("main").innerHTML=searchForm(j.code==="notfound"?`No record for ${serial} · Kayıt bulunamadı`:"Not available · Şu an açılamadı"); bindSearch();
  }catch(e){ $("main").innerHTML=searchForm("Connection problem · Bağlantı sorunu"); bindSearch(); }
}
main();
</script>
